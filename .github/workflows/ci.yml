name: Test & Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Run E2E Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://neondb_owner:npg_HxMtCdpEAl27@ep-dry-sunset-aoa4m5vl-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require' }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://neondb_owner:npg_HxMtCdpEAl27@ep-dry-sunset-aoa4m5vl-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require' }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'sample-secret-key-12345' }}
      NEXTAUTH_URL: 'http://127.0.0.1:3000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js app
        run: npx next build

      - name: Start server & Run E2E automated test
        run: |
          npm start &
          npx wait-on http://127.0.0.1:3000/api/health --timeout 60000
          npm test
