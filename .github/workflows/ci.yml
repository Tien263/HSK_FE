name: Test & Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Run E2E Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Start server in background
        run: |
          npm start &
          sleep 5

      - name: Wait for server & run automated test
        run: |
          npx wait-on http://127.0.0.1:3000/api/health --timeout 60000
          npm test
