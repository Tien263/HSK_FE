<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#245839"/>
      <stop offset="50%" stop-color="#1B432C"/>
      <stop offset="100%" stop-color="#0E281A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2"/>
      <stop offset="50%" stop-color="#D9B472"/>
      <stop offset="100%" stop-color="#B38636"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Outer ornamental gold ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.45" stroke-dasharray="16 10"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.85"/>

  <!-- Inner traditional seal border -->
  <rect x="116" y="116" width="280" height="280" rx="36" fill="#FFFBF2" filter="url(#shadow)"/>
  <rect x="126" y="126" width="260" height="260" rx="28" fill="none" stroke="#245839" stroke-width="4" opacity="0.3"/>

  <!-- Chinese Hanzi "汉" (Hanyu / Chinese) stylized in Songti / Seal style -->
  <text x="256" y="296" font-family="'Noto Serif SC', 'Songti SC', 'SimSun', 'STSong', serif" font-size="160" font-weight="bold" fill="#204434" text-anchor="middle" dominant-baseline="middle">
    汉
  </text>

  <!-- Small sub-label: HSK 3.0 -->
  <rect x="196" y="348" width="120" height="26" rx="13" fill="#D9B472"/>
  <text x="256" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#204434" text-anchor="middle" letter-spacing="1.5">
    HSK 3.0
  </text>
</svg>
