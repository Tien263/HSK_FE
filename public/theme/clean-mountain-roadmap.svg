<svg viewBox="0 0 800 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mist1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#476553" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#7a9886" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f7efe2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mist2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#365141" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#658270" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f7efe2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="backMist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6c8877" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f7efe2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Far Distant Misty Mountain Ridge -->
  <path d="M20,70 Q70,35 120,65 T220,50 T320,60 T440,30 T560,55 T680,20 T780,45 L780,120 L20,120 Z" fill="url(#backMist)"/>

  <!-- Peak 1 (Behind Step 01) -->
  <path d="M50,90 Q95,30 140,85 Q160,65 180,95 L180,120 L50,120 Z" fill="url(#mist1)"/>
  <!-- Subtle pine silhouettes on Peak 1 -->
  <path d="M92,38 L95,32 L98,38 L95,36 Z M90,44 L95,37 L100,44 L95,41 Z" fill="#2a3e32" opacity="0.6"/>

  <!-- Peak 2 (Behind Step 02) -->
  <path d="M250,95 Q295,20 340,80 Q370,60 400,95 L400,120 L250,120 Z" fill="url(#mist2)"/>

  <!-- Peak 3 (Behind Step 03) -->
  <path d="M460,95 Q500,28 545,80 Q575,55 610,95 L610,120 L460,120 Z" fill="url(#mist1)"/>

  <!-- Peak 4 (Behind Step 04) with classical pagoda pavilion -->
  <path d="M640,95 Q685,15 730,70 Q755,50 780,85 L780,120 L640,120 Z" fill="url(#mist2)"/>

  <!-- Classical Chinese Pagoda Pavilion (亭子) on Peak 4 right shoulder -->
  <g transform="translate(738, 48) scale(0.65)" opacity="0.85">
    <!-- Roof tier 1 -->
    <path d="M12,0 Q18,6 24,0 Q21,10 18,12 L6,12 Q3,10 0,0 Q6,6 12,0 Z" fill="#1c2d22"/>
    <!-- Roof tier 2 -->
    <path d="M12,-8 Q16,-3 20,-8 Q18,0 16,2 L8,2 Q6,0 4,-8 Q8,-3 12,-8 Z" fill="#1c2d22"/>
    <!-- Finial tip -->
    <line x1="12" y1="-8" x2="12" y2="-12" stroke="#1c2d22" stroke-width="1.5"/>
    <!-- Pillars -->
    <line x1="7" y1="12" x2="7" y2="22" stroke="#1c2d22" stroke-width="1.2"/>
    <line x1="11" y1="12" x2="11" y2="22" stroke="#1c2d22" stroke-width="1"/>
    <line x1="13" y1="12" x2="13" y2="22" stroke="#1c2d22" stroke-width="1"/>
    <line x1="17" y1="12" x2="17" y2="22" stroke="#1c2d22" stroke-width="1.2"/>
    <!-- Base stone -->
    <rect x="4" y="22" width="16" height="3" fill="#2a3e32" rx="1"/>
  </g>

  <!-- Birds flying near mountains -->
  <path d="M380,25 Q385,22 390,25 Q385,24 380,25 Z" fill="#365141" opacity="0.7"/>
  <path d="M395,20 Q399,18 403,20 Q399,19 395,20 Z" fill="#365141" opacity="0.6"/>
</svg>
