services:
  - type: web
    name: hsk-app
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate && (npx prisma db push || true) && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
        value: vf56y0nk
      - key: NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET
        value: hsk_upload
      - key: OPENAI_API_KEY
        sync: false
      - key: QWEN_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
