services:
  - type: web
    name: hsk-app
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate && (npx prisma db push || true) && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: DATABASE_URL
        sync: false
